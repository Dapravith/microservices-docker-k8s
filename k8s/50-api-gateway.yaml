apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aupp
  labels: { app: api-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      nodeSelector:
        role: frontend
      containers:
        - name: api-gateway
          image: aupp/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_SERVICE_URI
              value: "http://auth-service.aupp.svc.cluster.local:8081"
            - name: STUDENT_SERVICE_URI
              value: "http://student-service.aupp.svc.cluster.local:8082"
            - name: TEACHER_SERVICE_URI
              value: "http://teacher-service.aupp.svc.cluster.local:8083"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: "50m",  memory: "192Mi" }
            limits:   { cpu: "500m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aupp
spec:
  selector: { app: api-gateway }
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080   # exposed on every node's IP at :30080
