server:
  port: 8083

spring:
  application:
    name: teacher-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/teacher_db}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-very-long-random-secret-key-1234567890}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
