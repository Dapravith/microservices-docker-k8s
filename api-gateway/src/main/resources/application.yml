server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/auth/**
        - id: student
          uri: ${STUDENT_SERVICE_URI:http://student-service:8082}
          predicates:
            - Path=/student/**
        - id: teacher
          uri: ${TEACHER_SERVICE_URI:http://teacher-service:8083}
          predicates:
            - Path=/teacher/**

app:
  jwt:
    # MUST match the auth-service secret. In k8s this comes from a Secret.
    secret: ${JWT_SECRET:change-me-please-use-a-very-long-random-secret-key-1234567890}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
