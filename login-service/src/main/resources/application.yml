spring:
  application:
    name: login-service
  config:
    # Sensitive values are mounted as Docker secrets (see docker-compose.yml).
    # `optional:` prefix lets local dev / tests run without the file present.
    import:
      - "optional:file:/run/secrets/mongo.properties"
      - "optional:file:/run/secrets/jwt.properties"
  data:
    mongodb:
      # Pieces come from .env (docker-compose) or Secret env (k8s).
      # MONGO_URI, if set, overrides the constructed URI (used by k8s manifests).
      uri: ${MONGO_URI:mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}/${MONGO_DB}?${MONGO_OPTIONS}}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:5002}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:347186591486_change_me_must_be_at_least_32_chars}
    issuer: aupp-login-service
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

logging:
  level:
    root: INFO
    com.aupp: INFO
    org.springframework.data.mongodb: WARN
