# IMPORTANT: For real deployments rotate the JWT secret. The value below is
# 64+ characters as required by HS256/HS512.
#
# Regenerate base64 of a new secret like so:
#   openssl rand -base64 64 | tr -d '\n' | base64
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: aupp
type: Opaque
stringData:
  JWT_SECRET: "replace-me-with-a-64-byte-random-secret-replace-me-with-a-64-byte-random"
  MONGO_INITDB_ROOT_USERNAME: "root"
  MONGO_INITDB_ROOT_PASSWORD: "change-me-mongo-password"
