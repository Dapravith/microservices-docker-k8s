# Template for the app-secrets Secret.
# Copy this file to secret.yaml and fill in real values:
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
# secret.yaml is gitignored so the real Atlas password is never committed.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-long-random-secret-key"
  MONGO_URI: "mongodb+srv://<user>:<password>@<cluster-host>/ms_k8s?retryWrites=true&w=majority"
