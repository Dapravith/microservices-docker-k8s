server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://mongodb:27017/auth_db}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-very-long-random-secret-key-1234567890}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
    issuer: aupp-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info
