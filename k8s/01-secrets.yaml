---
# Replace these placeholders BEFORE applying. The Mongo URIs assume the
# in-cluster mongo Service from 05-mongodb.yaml; swap for Atlas/RDS as needed.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: msp
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_AT_LEAST_32_CHARACTERS_OF_RANDOM_BYTES"
  MONGO_URI_AUTH:    "mongodb://mongo.msp.svc.cluster.local:27017/auth_db"
  MONGO_URI_STUDENT: "mongodb://mongo.msp.svc.cluster.local:27017/student_db"
  MONGO_URI_TEACHER: "mongodb://mongo.msp.svc.cluster.local:27017/teacher_db"
