---
# Pinned to EC2-3 (label role=teacher). Mounts Vol2 per architecture diagram.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teacher-service
  namespace: msp
  labels:
    app: teacher-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teacher-service
  template:
    metadata:
      labels:
        app: teacher-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values: [teacher]
      containers:
        - name: teacher
          image: DOCKERHUB_USER/ms-teacher:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_URI_TEACHER
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -Djava.security.egd=file:/dev/./urandom"
          volumeMounts:
            - name: vol2
              mountPath: /var/data/teacher
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 5001 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 5001 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 768Mi }
      volumes:
        - name: vol2
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: teacher
  namespace: msp
spec:
  selector:
    app: teacher-service
  ports:
    - name: http
      port: 5001
      targetPort: 5001
