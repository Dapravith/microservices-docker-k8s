apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teacher-vol2
  namespace: aupp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teacher-service
  namespace: aupp
  labels: { app: teacher-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: teacher-service }
  template:
    metadata:
      labels: { app: teacher-service }
    spec:
      # Pin to EC2-3 (Vol 2 in the architecture diagram)
      nodeSelector:
        role: teacher
      containers:
        - name: teacher-service
          image: aupp/teacher-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb.aupp.svc.cluster.local:27017/teacher_db"
          volumeMounts:
            - name: vol2
              mountPath: /var/data/teacher
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: "50m",  memory: "192Mi" }
            limits:   { cpu: "500m", memory: "384Mi" }
      volumes:
        - name: vol2
          persistentVolumeClaim:
            claimName: teacher-vol2
---
apiVersion: v1
kind: Service
metadata:
  name: teacher-service
  namespace: aupp
spec:
  selector: { app: teacher-service }
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  type: ClusterIP
