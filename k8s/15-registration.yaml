---
# Sole writer of the auth_db.users collection. Co-located with login on EC2-1
# frontend since both serve the edge-auth flow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: msp
  labels:
    app: registration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - frontend
      containers:
        - name: registration
          image: DOCKERHUB_USER/ms-registration:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_URI_AUTH
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -Djava.security.egd=file:/dev/./urandom"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 5003
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5003
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: registration
  namespace: msp
spec:
  selector:
    app: registration-service
  ports:
    - name: http
      port: 5003
      targetPort: 5003