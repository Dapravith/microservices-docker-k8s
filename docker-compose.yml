version: "3.9"

# Local single-host stack. Mirrors the production k8s topology but everything
# runs on one machine. Use this to develop, test, and confirm the JWT flow
# before pushing images and deploying to the AWS cluster.

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    image: aupp/auth-service:1.0.0
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      MONGO_URI: mongodb://mongodb:27017/auth_db
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-very-long-random-secret-key-1234567890}
      JWT_TTL_SECONDS: 3600
    ports: ["8081:8081"]

  student-service:
    build: ./student-service
    image: aupp/student-service:1.0.0
    container_name: student-service
    restart: unless-stopped
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      MONGO_URI: mongodb://mongodb:27017/student_db
    ports: ["8082:8082"]

  teacher-service:
    build: ./teacher-service
    image: aupp/teacher-service:1.0.0
    container_name: teacher-service
    restart: unless-stopped
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      MONGO_URI: mongodb://mongodb:27017/teacher_db
    ports: ["8083:8083"]

  api-gateway:
    build: ./api-gateway
    image: aupp/api-gateway:1.0.0
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - student-service
      - teacher-service
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      STUDENT_SERVICE_URI: http://student-service:8082
      TEACHER_SERVICE_URI: http://teacher-service:8083
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-very-long-random-secret-key-1234567890}
    ports: ["8080:8080"]

volumes:
  mongo_data:
