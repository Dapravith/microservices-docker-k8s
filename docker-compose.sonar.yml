# Local SonarQube + Postgres. Bring it up before running the scan script:
#
#   docker-compose -f docker-compose.sonar.yml up -d
#   open http://localhost:9000   # default login admin/admin (change immediately)
#   # generate a User Token in the UI, then export it:
#   export SONAR_TOKEN=<token>
#   ./infra/scripts/sonar-scan.sh
#
# Tear down with:
#   docker-compose -f docker-compose.sonar.yml down
services:
  sonardb:
    image: postgres:17
    container_name: sonardb
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonardb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:10.6-community
    container_name: sonarqube
    depends_on:
      sonardb:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  sonardb-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
