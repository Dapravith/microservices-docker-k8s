---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: msp
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values: [frontend]
      containers:
        - name: api-gateway
          image: DOCKERHUB_USER/ms-gateway:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: LOGIN_SERVICE_URL
              value: "http://authentication-service.msp.svc.cluster.local:5002"
            - name: REGISTRATION_SERVICE_URL
              value: "http://registration-service.msp.svc.cluster.local:5003"
            - name: STUDENT_SERVICE_URL
              value: "http://student-service.msp.svc.cluster.local:5000"
            - name: TEACHER_SERVICE_URL
              value: "http://teacher-service.msp.svc.cluster.local:5001"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -Djava.security.egd=file:/dev/./urandom"
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 4000 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 768Mi }
