apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: aupp
  labels: { app: auth-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      nodeSelector:
        role: frontend
      containers:
        - name: auth-service
          image: aupp/auth-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/auth_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_TTL_SECONDS
              value: "3600"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: "50m",  memory: "192Mi" }
            limits:   { cpu: "500m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: aupp
spec:
  selector: { app: auth-service }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP
