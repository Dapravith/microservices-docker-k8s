server:
  port: 8082

spring:
  application:
    name: student-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/student_db}

teacher:
  service-uri: ${TEACHER_SERVICE_URI:http://teacher-service:8083}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-very-long-random-secret-key-1234567890}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
