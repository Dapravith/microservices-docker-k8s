server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: login-service
          uri: ${LOGIN_SERVICE_URI:http://login-service:8081}
          predicates:
            - Path=/auth/**
        - id: student-service
          uri: ${STUDENT_SERVICE_URI:http://student-service:8082}
          predicates:
            - Path=/student/**
        - id: teacher-service
          uri: ${TEACHER_SERVICE_URI:http://teacher-service:8083}
          predicates:
            - Path=/teacher/**

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-very-long-random-secret-key-1234567890}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
