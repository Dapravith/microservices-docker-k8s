# MongoDB Atlas is the database. Non-sensitive config lives in .env;
# the password and JWT secret are mounted as Docker secrets (./secrets/*.properties),
# read by Spring Boot via `spring.config.import` in each application.yml.
# Result: secrets do NOT appear in `docker inspect` or any container env.
#
# All services share a single database (ms_k8s) — collections are distinct:
#   users, assignments, teacher_assignments.

x-mongo-env: &mongo-env
  MONGO_USER: ${MONGO_USER}
  MONGO_HOST: ${MONGO_HOST}
  MONGO_DB: ${MONGO_DB}
  MONGO_OPTIONS: ${MONGO_OPTIONS}

secrets:
  mongo_credentials:
    file: ./secrets/mongo.properties
  jwt_credentials:
    file: ./secrets/jwt.properties

services:
  registration:
    build: ./Registration_Microservice
    image: ms-registration:1.0
    container_name: ms-registration
    environment:
      <<: *mongo-env
      PORT: 5003
    secrets:
      - source: mongo_credentials
        target: mongo.properties
        mode: 0400
    ports:
      - "5003:5003"

  login:
    build: ./Authentication_Microservice
    image: ms-login:1.0
    container_name: ms-login
    environment:
      <<: *mongo-env
      PORT: 5002
      JWT_ACCESS_EXPIRATION_SECONDS: ${JWT_ACCESS_EXPIRATION_SECONDS}
      JWT_REFRESH_EXPIRATION_SECONDS: ${JWT_REFRESH_EXPIRATION_SECONDS}
    secrets:
      - source: mongo_credentials
        target: mongo.properties
        mode: 0400
      - source: jwt_credentials
        target: jwt.properties
        mode: 0400
    ports:
      - "5002:5002"

  student:
    build: ./Student_Microservice
    image: ms-student:1.0
    container_name: ms-student
    environment:
      <<: *mongo-env
      PORT: 5000
    secrets:
      - source: mongo_credentials
        target: mongo.properties
        mode: 0400
    ports:
      # Host 5000 is owned by macOS AirPlay Receiver, so map to 5010 instead.
      # Container still listens on 5000; the gateway reaches it at student:5000.
      - "5010:5000"

  teacher:
    build: ./Teacher_Microservice
    image: ms-teacher:1.0
    container_name: ms-teacher
    environment:
      <<: *mongo-env
      PORT: 5001
    secrets:
      - source: mongo_credentials
        target: mongo.properties
        mode: 0400
    ports:
      - "5001:5001"

  gateway:
    build: ./APIGateway_Microservice
    image: ms-gateway:1.0
    container_name: ms-gateway
    environment:
      PORT: 4000
      LOGIN_SERVICE_URL: http://login:5002
      REGISTRATION_SERVICE_URL: http://registration:5003
      STUDENT_SERVICE_URL: http://student:5000
      TEACHER_SERVICE_URL: http://teacher:5001
    secrets:
      - source: jwt_credentials
        target: jwt.properties
        mode: 0400
    ports:
      - "4000:4000"
    depends_on:
      - login
      - registration
      - student
      - teacher
