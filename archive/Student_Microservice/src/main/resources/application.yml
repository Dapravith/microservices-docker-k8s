spring:
  application:
    name: student-service
  config:
    # Sensitive values are mounted as Docker secrets (see docker-compose.yml).
    # `optional:` prefix lets local dev / tests run without the file present.
    # Repo-root paths let `./mvnw spring-boot:run` work without sourcing .env.
    import:
      - "optional:file:/run/secrets/mongo.properties"
      - "optional:file:../secrets/mongo.properties"
      - "optional:file:../.env[.properties]"
  data:
    mongodb:
      # Pieces come from .env (docker-compose) or Secret env (k8s).
      # MONGO_URI, if set, overrides the constructed URI (used by k8s manifests).
      uri: ${MONGO_URI:mongodb://localhost:27017/ms_k8s}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:5000}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.aupp: INFO
    org.springframework.data.mongodb: WARN
